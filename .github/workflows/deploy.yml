name: deploy

# Builds the marketing site and deploys to S3 + CloudFront on every push to main.
# Auth: GitHub OIDC -> ci-lingo-landing role (no stored AWS keys). The role can
# only write to the marketing bucket and invalidate its distribution.
#
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_APP_ORIGIN             — where the SPA lives (https://app.<domain>)
#   VITE_SITE_ORIGIN            — this site's own origin (canonical/OG URLs)
#   LANDING_S3_BUCKET           — target bucket (tf output marketing_bucket_name)
#   LANDING_CLOUDFRONT_DIST_ID  — tf output marketing_distribution_id
#   LANDING_VERIFY_URL          — URL the post-deploy check curls. Point this at
#                                 the distribution's *.cloudfront.net domain
#                                 until the apex flip, then at the apex.
#
# Both origins are repo VARIABLES, not secrets: they are public hostnames, and
# keeping them visible makes a domain change a settings edit you can see.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

env:
  AWS_REGION: us-west-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The build prerenders every route in a real browser (scripts/prerender.mjs),
      # so the runner needs Chromium. `--only-shell` pulls the headless shell
      # rather than the full browser — it is all Playwright launches here.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:run
      - name: build
        env:
          VITE_APP_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
        run: npm run build
      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::349654078389:role/ci-lingo-landing
          aws-region: ${{ env.AWS_REGION }}
      - name: sync to S3
        run: |
          # Assets first, with --delete to prune what the build dropped.
          # Hashed filenames make these safely immutable.
          #
          # `*.html` rather than `index.html` is load-bearing: prerendering
          # emits dist/roadmap/index.html, dist/docs/<slug>/index.html and so
          # on, and the old root-only exclude would have given every one of
          # those a one-year immutable TTL, freezing each route at whatever
          # shipped first.
          aws s3 sync dist/ "s3://${{ vars.LANDING_S3_BUCKET }}" \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"
          # Every HTML file revalidates: each points at hashed asset URLs, and
          # the CloudFront cache policy defers to this header.
          aws s3 sync dist/ "s3://${{ vars.LANDING_S3_BUCKET }}" \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"
      - name: invalidate CloudFront
        run: |
          # "/*" rather than just the root: prerendering means /roadmap,
          # /docs and every /docs/<slug> are their own HTML objects, and a
          # root-only invalidation would leave all of them serving the
          # previous build. Assets are content-hashed so re-fetching them
          # costs nothing.
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.LANDING_CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
      - name: verify site responds
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.LANDING_VERIFY_URL }}")
          echo "Site returned HTTP $status"
          test "$status" = "200"
