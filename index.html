<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Schibsted Grotesk: display + body. IBM Plex Mono: readings and labels —
         a phonetic transcription should look like a transcription. Noto JP/KR
         cover the hero's target-script glyphs (Google serves unicode-range
         subsets, so only the handful of chunks actually used get fetched). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Open Lingo — free, open-source language learning</title>
    <meta
      name="description"
      content="Structured courses, spaced-repetition flashcards, and letter practice. Free, open-source, and yours to fork."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
